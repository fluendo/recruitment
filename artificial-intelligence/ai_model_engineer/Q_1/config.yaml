face_detector:
  model_path: models/yolov8n-face.pt
  confidence_threshold: 0.25

depth_estimator:
  model_type: MiDaS_small      

anonymizer:
  method: blur               # blur | pixelation | masking
  blur_kernel_size: 151           # odd integer, used when method=blur
  pixelation_block_size: 10      # pixel block size, used when method=pixelation
  mask_color: [0, 0, 0]          # BGR, used when method=masking
  depth_threshold: 0.4         # faces with median depth >= th -> foreground

depth_mask:
  close_ksize: 15                # morphological closing kernel 
  dilate_ksize: 7                # dilation kernel 
  feather_ksize: 21              # Gaussian feather for soft edges 

visualization:
  box_color: [0, 255, 0]          # BGR green for face bounding boxes
  text_color: [0, 255, 0]         # BGR green for text labels
  box_thickness: 2
  font_scale: 0.5
  bg_blur_kernel_size: 151         # Gaussian kernel for background blur

pipeline:
  device: auto                   # auto | cpu | cuda

output:
  grid_path: output_grid.mp4      
  anonymized_path: output_anon.mp4 
  codec: mp4v                    
